name: Deploy backend (ECR + App Runner)

# Backend CI/CD for cuad-ai-demo, per readme_docs/AWS_DEPLOYMENT_PLAN.md:
#   push to main -> docker build -> ECR push -> App Runner deploys the new image.
# Auth is GitHub OIDC (no long-lived AWS keys) assuming the backend role that
# deploy/terraform/ provisions (output: github_actions_backend_role_arn).
#
# Required GitHub config (Settings -> Secrets and variables -> Actions):
#   secret  AWS_DEPLOY_ROLE_ARN   = <github_actions_backend_role_arn output>
#   var     AWS_REGION            = us-east-1            (optional; defaults below)
#   var     ECR_REPOSITORY        = <ecr repo name, e.g. cuad-ai-demo>
#   var     APPRUNNER_SERVICE_ARN = <app runner service ARN>   (optional)

on:
  push:
    branches: [main]
    paths-ignore:
      - "readme_docs/**"
      - "tests/**"
      - "deploy/**"
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      # App Runner auto-deploys on ECR push when auto-deploy is enabled; this makes
      # the rollout explicit and lets the job fail loudly if the service is missing.
      - name: Trigger App Runner deployment
        if: ${{ vars.APPRUNNER_SERVICE_ARN != '' }}
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ vars.APPRUNNER_SERVICE_ARN }}" \
            --region "$AWS_REGION"
